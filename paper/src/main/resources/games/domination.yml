# Three capture points; a team keeps a point until another takes it, and scores a point a second for each it owns.
# The arena needs regions point-a, point-b and point-c (/mg arena example region point-a set).
gametype: domination
name: "<aqua>Domination"
capture-points:
  point-a: "<white>point A"
  point-b: "<white>point B"
  point-c: "<white>point C"
min-players: 4
max-players: 8
# Players wait in the arena; set a lobby (/mg lobby set) and use "lobby" to keep them out of it until the start.
waiting: arena
teams: { count: 2 }
# Players spread over all spawns instead of a team sharing one (the default is together).
team-spawns: spread
play-seconds: 300
points-to-win: 600
arenas: [example]
stats: [combat]
features:
  playing:
    # Players are in survival here, so nothing breaks unless a variant lists blocks.
    break-blocks: { whitelist: [] }
    kit: { items: [wooden_sword] }
    no-hunger: {}
quit: { then: die, rejoin-seconds: 60 }

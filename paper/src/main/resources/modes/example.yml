# A mode: a playable variant of a game. Players join it with /mg join example.
game: last-standing
name: "<gold>Void Fall"
min-players: 2
max-players: 8
# in-place: players stay where they are until the start; lobby: they wait in the lobby from config.yml;
# arena: they wait in the arena, already prepared.
waiting: arena
# Free arenas are picked in this order; each must have spawns.
arenas: [example]
# Features per phase of the game (last-standing has waiting, playing and ending).
features:
  playing:
    # Players below this height are out.
    void-kills: { y: 0 }

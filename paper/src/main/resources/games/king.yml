# Two teams, each with a King chosen at random. While the King lives, the team comes back after dying; once the King falls,
# every death of that team is final. Last team standing wins; when time runs out, the team whose King lives, then the one
# with more living members, then the one with more kills.
gametype: king
name: "<gold>King"
min-players: 4
max-players: 16
# Players wait in the arena; set a lobby (/mg lobby set) and use "lobby" to keep them out of it until the start.
waiting: arena
fight-seconds: 300
# A fallen member of a team that still has its King comes back after this many seconds.
respawn-seconds: 5
teams: { count: 2 }
team-spawns: spread
# One King per team, the rest are guards. Each rank gets its own kit; armor in a kit is worn.
ranks:
  king:
    players: 1
    features:
      fighting:
        # A heavy armored target with a weak weapon, visible to everyone.
        kit: { items: [netherite_helmet, netherite_chestplate, netherite_leggings, netherite_boots, wooden_sword] }
        effects: { glowing: 1 }
  guard:
    features:
      fighting:
        kit: { items: [iron_sword, leather_chestplate, bow, arrow 16] }
arenas: [example]
stats: [combat]
features:
  fighting:
    break-blocks: { whitelist: [] }
    death-items: { items: vanish, xp: vanish }
    no-hunger: {}
# A King who quits dies, which ends the respawns of their team like any other death.
quit: { then: die, rejoin-seconds: 60 }
hud:
  sidebar:
    fighting: ["", "<gray>Time: <yellow>%time%", "<gray>You are: <white>%rank%", "<gray>Your King: <gold>%king%", "<gray>Kills: <white>%points%"]

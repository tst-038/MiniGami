# A game: what players join, with /mg join void-fall, and see their stats of. The game type is the code it runs.
# Every bundled game plays in the example arena; give it spawns first (/mg arena example spawn add).
# What a game type or feature can be set to: /mg gametype <id> info and /mg feature <id> info.
# Change a game by command with /mg game <id> set <key> <value>, or edit the file and /mg reload.
gametype: last-standing
name: "<gold>Void Fall"
min-players: 2
max-players: 8
# in-place: players stay where they are until the start; lobby: they wait in the lobby from config.yml;
# arena: they wait in the arena. In the lobby and the arena their own state is saved and cleared at once.
waiting: arena
# How many deaths put a player out; 0 means they always respawn. Without it, the game decides (last-standing: 1).
# lives: 3
# Free arenas are picked in this order; each must have spawns.
arenas: [example]
# Features per phase of the game (last-standing has waiting, playing and ending).
features:
  playing:
    # Players below this height die.
    void-kills: { y: 0 }
    # Items for every player, each with an optional amount, and/or an inventory saved with /mg kit save.
    # kit: { items: [iron_sword, arrow 16] }
    # kit: { saved: seeker }
# Variants are laid over the settings above and counted as this game in the stats; each needs a name.
# Players join one with /mg join void-fall <variant>.
variants:
  lives:
    name: "<gold>Void Fall <gray>(3 lives)"
    lives: 3

# Everyone for themselves: hold the hill alone to score a point a second.
# The arena needs a region called hill (/mga arena example region hill set).
gametype: domination
name: "<gold>King of the Hill"
capture-points: { hill: "<gold>the hill" }
# Seconds to stand on it alone to take it.
capture-seconds: 3
# Only owned while stood on.
keep-captured: false
min-players: 2
max-players: 8
# Players wait in the arena; set a lobby (/mga lobby set) and use "lobby" to keep them out of it until the start.
waiting: arena
play-seconds: 180
points-to-win: 60
arenas: [example]
stats: [combat]
features:
  playing:
    break-blocks: { whitelist: [] }
    kit: { items: [wooden_sword] }
    no-hunger: {}
# Who quits dies, and may come back within 60 seconds.
quit: { then: die, rejoin-seconds: 60 }
variants:
  teams:
    name: "<gold>King of the Hill <gray>(2v2)"
    min-players: 4
    teams: { size: 2 }
    spawns: { teams: spread }   # players spread over all spawns instead of a team sharing one

  kicked: "%prefix%<red>You were kicked from the party."
  member-kicked: "%prefix%<white>%player%</white> <yellow>was kicked from the party."
  new-leader: "%prefix%<white>%player%</white> <gold>is the new party leader."
  disbanded: "%prefix%<yellow>The party was disbanded."
  list-header: "%prefix%<gold>Your party <gray>(%count%):"
  list-leader: "<gray> - <gold>★ <white>%player%</white> %status%"
  list-member: "<gray> - <white>%player%</white> %status%"
  online: "<green>online"
  offline: "<gray>offline"

# Game nights, run by commands: /mga night. %name% is the night's name from its template, in its own formatting.
night:
  # %night%: as typed, %nights%: the ones there are
  unknown: "%prefix%<red>Unknown game night <white>%night%</white><red>. Try: <white>%nights%</white>"
  none: "%prefix%<red>No game night is running."
  # %name%: the night that is running
  already-running: "%prefix%%name%<red> is already running."
  # Told to the hosts when they start a night
  opened: "%prefix%<green>Sign-up for %name%<green> is open. Start with <white>/mga night begin</white>."
  # To everyone online. <join>…</join> joins on click
  open: "%prefix%%name% <gold>is open for sign-up! <join><hover:show_text:'Click to join'><green><bold>[Join]</bold></green></hover></join>"
  already-joined: "%prefix%<red>You're already in the night."
  # %player%: who may not join game nights (a permission, minigami.night.join)
  not-allowed: "%prefix%<red>%player% can't join game nights."
  not-joined: "%prefix%<red>You're not in the night."
  party-leader-only: "%prefix%<red>Only the party leader can join the night."
  # %size%: players in the party who are online, %team%: most players in a night team
  party-too-big: "%prefix%<red>Your party is too big (<white>%size%</white>/%team% per team)."
  # %count%: how many are in the night now
  joined: "%prefix%<green>You joined %name%<green>. <gray>(<white>%count%</white> players)"
  # %player%
  player-joined: "%prefix%<white>%player%</white> <green>joined the night."
  left: "%prefix%<yellow>You left the night. <gray>Your points are kept."
  player-left: "%prefix%<white>%player%</white> <yellow>left the night."
  # %player%: who the host kicked
  kicked: "%prefix%<green>Kicked <white>%player%</white> from the night."
  added: "%prefix%<green>Added <white>%player%</white> to the night."
  player-already-in-night: "%prefix%<red><white>%player%</white> is already in the night."
  you-were-kicked: "%prefix%<red>You were kicked from the night."
  # begin
  already-begun: "%prefix%<red>The night has begun. Use <white>/mga night next</white>."
  nobody: "%prefix%<red>Nobody has joined yet."
  # %team%: the night team's name, %members%: who is in it
  your-team: "%prefix%<gray>You're in <white>%team%</white> <gray>with <white>%members%</white><gray>."
  # next
  not-begun: "%prefix%<red>The night has not begun; start it with <white>/mga night begin</white>."
  game-running: "%prefix%<red>A game is being played; skip it with <white>/mga night skip</white> or wait for it to end."
  # %game%: the playlist's game id
  missing-game: "%prefix%<red>The game <white>%game%</white> of the playlist doesn't exist (anymore), or has no such variant. Skip it with <white>/mga night skip</white>."
  # %size%: players online in the night, %min%, %max%: what the game holds
  too-few: "%prefix%<red>Only %size% players of the night are online, but this game needs %min%. Retry with <white>/mga night next</white> or skip it."
  too-many: "%prefix%<red>%size% players are in the night, but this game holds %max%. Kick some, or skip the game."
  # %players%: who is in another match
  busy: "%prefix%<red>These players are in another match: <white>%players%</white>. Retry with <white>/mga night next</white>."
  # %game%: the game's name
  no-free-arena: "%prefix%<red>All arenas of %game%<red> are busy. Retry with <white>/mga night next</white> when one is free."
  # None of its arenas is set up for it. %game%: the game's name
  not-ready: "%prefix%<red>No arena is set up for %game%<red> yet. Fix it, then retry with <white>/mga night next</white>, or skip it."
  # %player%
  join-failed: "%prefix%<red>%player% can't join right now: their things from an earlier match still need to be given back. Retry with <white>/mga night next</white>."
  open-failed: "%prefix%<red>The game could not be opened; see the server log. Retry with <white>/mga night next</white> or skip it."
  # %number%, %total%: the game's place in the playlist, %game%: its name
  game-starting: "%prefix%<gold>Game %number% of %total%: <white>%game%"
  # Told to the hosts when a game ended. %game%: the next game's name
  next-up: "%prefix%<gray>Up next: %game%<gray>. Start it with <white>/mga night next</white> or skip it with <white>/mga night skip</white>."
  # %game%: the name of the game skipped
  skipped: "%prefix%<yellow>Skipped %game%<yellow>."
  no-game-playing: "%prefix%<red>No game of the night is being played."
  paused: "%prefix%<green>Paused the game."
  resumed: "%prefix%<green>Resuming the game."
  already-paused: "%prefix%<red>The game is paused already."
  not-paused: "%prefix%<red>The game is not paused, or is counting down to go on."
  cancelled: "%prefix%<yellow>%name%<yellow> was cancelled before any game was played."
  # team
  no-teams: "%prefix%<red>The night has no teams to move players between."
  # %team%: as typed, %teams%: the ones there are
  no-such-team: "%prefix%<red>There is no night team <white>%team%</white>. There are: <white>%teams%</white>"
  # %player%: who is moved, %team%: the team's name
  moved: "%prefix%<green>Moved <white>%player%</white> to <white>%team%</white>."
  you-were-moved: "%prefix%<gray>You were moved to <white>%team%</white><gray>."
  # %player%
  player-not-in-night: "%prefix%<red><white>%player%</white> is not in the night."
  # %name%: the night's name, %done%, %total%: games played of the playlist
  standings-header: "%prefix%%name% <gray>- standings after game %done% of %total%"
  final-header: "%prefix%%name% <gold>is over! Final standings:"
  # %place%, %name%: the player or night team, %points%, %tied%: the tied text when others share the place
  standings-line: "<gray> %tied%%place%. <white>%name%</white> <gray>- <white>%points%</white> points"
  standings-own: "<gray> You: <white>%points%</white> points, place <white>%tied%%place%</white>"
  # shown before a place that more than one player or team shares (ex aequo)
  tied: "="
  standings-none: "<gray> Nobody has scored yet."
  # %team%: the team's coloured name, as in matches
  team-name: "%team%"
  # %name%: the team's name, %members%
  team-members: "%name% <gray>(%members%)"
  sidebar:
    title: "%name%"
    # %game%: the next game's name
    next: "<gray>Next: <white>%game%"
    # Shown while nobody has points yet
    none: "<gray>No points yet"
    # %count%: players in the night
    players: "<gray>Players: <white>%count%"
    # %count%: night teams, only shown with teams
    teams: "<gray>Teams: <white>%count%"
    # %number%, %total%: the next game's place in the playlist
    progress: "<gray>Game: <white>%number%/%total%"
    # %place%, %name%, %points%, %tied%
    line: "<gray>%tied%%place%. <white>%name% <gold>%points%"

# Games that schedules open on their own. %name%: the schedule's name
schedule:
  # To everyone who could join. %game%: the game, %seconds%: left to join, %needed%: players it needs. <join>…</join> joins on click
  call: "%prefix%%name%<gray>: %game%<gold> is open! <gray>Needs <white>%needed%</white> players, <white>%seconds%</white>s to join. <join><hover:show_text:'Click to join'><green><bold>[Join]</bold></green></hover></join>"
  reminder: "%prefix%%name%<gray>: <white>%seconds%</white>s left to join %game%<gray>. <join><hover:show_text:'Click to join'><green><bold>[Join]</bold></green></hover></join>"
  # To the players in the match when the call closed before enough joined. %game%
  not-enough-players: "%prefix%%game%<red> called off: not enough players."
  # To everyone who could join when the call closed and nobody had. %name%, %game%
  nobody-joined: "%prefix%%name%<gray>: nobody joined %game%<gray>, called off."
  no-call: "%prefix%<red>No scheduled game is open."
  # To a winner once the game is over. %reward%: its name, %game%
  reward: "%prefix%<gold>You won <white>%reward%</white> <gold>in %game%<gold>!"
  # When the call's match emptied and no arena is free to open it again. %game%
  no-arena: "%prefix%<red>All arenas for %game%<red> are busy. Try again soon."
  # To hosts when a time came and no game fits. %players%: how many could join
  skipped: "%prefix%<gray>%name%<gray> skipped its game: none fits %players% players who could join."
  opened: "%prefix%<green>%name%<green> opened its next game."
  night-running: "%prefix%<red>%name%<red> doesn't open games during a game night."
  call-open: "%prefix%<red>%name%<red> still has a game open to join."
  open-failed: "%prefix%<red>%name%<red> could not open its game; see the server log."
  paused: "%prefix%<yellow>%name%<yellow> is paused until resumed, or until the server restarts."
  already-paused: "%prefix%<red>%name%<red> is paused already."
  resumed: "%prefix%<green>%name%<green> runs again."
  not-paused: "%prefix%<red>%name%<red> isn't paused."
  # %schedule%: as typed, %schedules%: the ones there are
  unknown: "%prefix%<red>There is no schedule called <white>%schedule%</white>. There are: <white>%schedules%</white>"
  none: "%prefix%<gray>There are no schedules. Add one in schedules/<id>.yml."
  list-header: "%prefix%<gold>Schedules:"
  # %id%, %next%: when it opens a game next, %state%: one of the states below, or nothing
  list-entry: "<gray> - </gray>%name% <dark_gray>(%id%)</dark_gray> <gray>next %next%</gray>%state%"
  state:
    paused: " <yellow>paused"
    calling: " <green>open to join"

debug:
  summary: "%prefix%<gray>MiniGami <white>%version%</white>, matches: <white>%matches%</white>, listeners: <white>%listeners%</white>, players with saved state: <white>%snapshots%</white>"
  match: "%prefix%<gray>%game% on %arena%: phase <white>%phase%</white>, <white>%members%</white> in match, <white>%alive%</white> alive, tick <white>%tick%</white>"

# /mga doctor: why games can't be played where. Also shown to staff when a join fails, and logged at each load.
doctor:
  header: "%prefix%<gold>Doctor</gold> <gray>what keeps games out of arenas:"
  no-games: "<gray> No games are set up."
  # %target%: as typed
  unknown: "%prefix%<red>There is no game or arena called <white>%target%</white>."
  # %game%: the game's id, %name%: its name
  game-ready: "<green> ✔ <white>%game%</white> is ready in all its arenas."
  game-partly: "<yellow> ● <white>%game%</white> plays, but not in every arena:"
  game-not-ready: "<red> ✖ <white>%game%</white> has no arena that can host it:"
  game-not-loaded: "<red> ✖ <white>%game%</white> didn't load:"
  # %arena%
  arena: "<yellow> ● Arena <white>%arena%</white>:"
  arena-ready: "<green> ✔ Arena <white>%arena%</white> can host every game that lists it."
  arena-not-loaded: "<red> ✖ Arena <white>%arena%</white> didn't load, so no game plays in it:"
  # %problem%: a problem in a file
  problem: "<red>   - %problem%"
  reload: "<gray>   Its file changed since the last load; <white>/mga reload</white> to load it."
  # One finding. %arena%, %game%: the game's id and variant, %reason%: one of the diagnosis texts, %fix%: the fix line or nothing
  blocking: "<red>   ✖ <white>%arena%</white> can't host <white>%game%</white>: %reason%%fix%"
  warning: "<yellow>   ● <white>%arena%</white> hosts <white>%game%</white>, but %reason%%fix%"
  # %command%: what fixes it; <suggest>…</suggest> fills it in on click
  fix: " <suggest><hover:show_text:'Click to fill in'><gray>(<white>%command%</white>)</gray></hover></suggest>"
  # After the reasons a join failed. %command%: the doctor command for the game
  more: "<gray>   More: <suggest><white>%command%</white></suggest>"

# Why an arena can't host a game, for the doctor lines above. Placeholders per reason.
# %area%: the region; %key%: what the quota counts; %found%: how many there are; %wanted%: the range asked for; %seed%: to make the same land again
terrain:
  quota-missed: "<red>[MiniGami] Land in <white>%area%</white> misses its quota: <white>%key%</white> has %found%, wanted %wanted% <gray>(seed %seed%)"

diagnosis:
  # %region%, %players%, %height%: the region lacks room for a pole each for that many players, or is shorter than that
  pole-duel-too-small: "<red>region <white>%region%</white> is too small for <white>%players%</white> poles, or under <white>%height%</white> blocks high"
  no-spawns: "<red>it has no spawns"
  # %region%
  missing-region: "<red>missing region <white>%region%</white>"
  # %group%: such as wall, met by wall, wall-1 or wall-north
  missing-region-group: "<red>no region of group <white>%group%</white>"
  # %region%, %teams%: the most teams a match can have
  missing-team-region: "<red>missing region <white>%region%</white>, one per team for up to %teams% teams"
  no-map: "<red>it changes blocks but the arena has no saved map to put them back"
  # %region%: lies partly or fully outside the saved map
  region-outside-map: "<red>region <white>%region%</white> is not fully inside the saved map, so changes there would not be put back"
  no-worldedit: "<red>it changes blocks, and putting them back needs WorldEdit or FastAsyncWorldEdit"
  no-loot-points: "<yellow>it fills loot containers but the arena has none; set them with /mga arena <id> loot add"
  # %x%, %y%, %z%: where the point is
  loot-point-gone: "<yellow>the loot container at <white>%x% %y% %z%</white> is no longer a chest, barrel or shulker box"
  # %table%: its id, %x%, %y%, %z%: where the point is
  unknown-loot-table: "<red>the loot container at <white>%x% %y% %z%</white> names a table that does not exist: <white>%table%</white>"
  # %key%, %style%: a quota key that is no ore, placer, group or block of the terrain style
  unknown-quota-key: "<red>the terrain quota names <white>%key%</white>, which style <white>%style%</white> has no ore, placer or block for"
  # %key%, %area%, %wanted%, %room%
  quota-too-large: "<red>the terrain quota wants <white>%wanted% %key%</white> in <white>%area%</white>, which has room for about %room%"
  # %key%, %area%, %lowest%, %height%
  ore-out-of-reach: "<red>the terrain quota wants <white>%key%</white> in <white>%area%</white>, but it only occurs from y=%lowest% and the region is %height% high"
  # %area%, %at%
  anchor-outside-area: "<red>a spawn at <white>%at%</white> is too close to the edge of the terrain in <white>%area%</white>"
  # %area%, %at%, %sea%
  anchor-below-sea: "<red>a spawn at <white>%at%</white> in <white>%area%</white> lies below the terrain's sea level (%sea%)"
  # %spawns%, %teams%
  few-team-spawns: "<yellow>it has %spawns% spawn(s) for up to %teams% teams, so some teams share a spawn"

# Up to 4 teams prepare walled off in their own quarter, then the walls drop and a border closes in; the last team standing wins.
# The arena needs: a saved map (/mga arena example map save), a spawn per team (team: red, blue, green, yellow),
# a region per team to prepare in, quarter-1 up to quarter-4 (/mga arena example region quarter-1 set),
# a region called fighting (the whole map, outer walls excluded), a region called border, and its walls: regions named wall or wall-<anything> (wall-north, ...). A wall drops to air,
# or with WorldEdit installed, to a broken version saved by /mga arena example region <name> schematic.
# The quarters are made new for every match (land of the style below, with the ores the quota asks for in each), so the arena can
# stand anywhere, even in an ocean: each quarter needs room for the land (80 or more blocks high is plenty). Try a style out with
# /mga arena example terrain preview quarter plains; the arena's saved map puts the old blocks back after each match.
# Loot containers are set with /mga arena example loot add <table> while looking at a chest.
gametype: the-wall
name: "<dark_red>The Wall"
min-players: 4
max-players: 16
# Players wait in the arena; set a lobby (/mga lobby set) and use "lobby" to keep them out of it until the start.
waiting: arena
teams: { count: 4 }
# Teammates start and respawn together in their quarter (together is the default; spread: every player takes the next spawn).
spawns: { teams: together }
prepare-seconds: 900
# Closes the border region in to 20 blocks over 5 minutes; half a heart a second outside it.
border: { end-size: 20, shrink-seconds: 300, damage: 1 }
arenas: [example]
# While preparing, a team keeps to its own quarter and may build and break there; once the walls drop, everywhere inside the
# fighting region is open, and the outer walls of the map stay shut.
features:
  # The land is made in building, while the start countdown holds everyone still, and building ends when it is placed.
  building:
    # style: a file in terrain/. Every quarter gets the same quota, so no team starts richer. Ranges are drawn once per match;
    # 60- means at least 60. Other keys that work: iron, coal, gold, redstone, lapis, copper, ores (all of them), trees, water, a block id.
    terrain: { style: plains, regions: quarter, max-attempts: 8, quota: { diamond: 4-6, iron: 30-50, coal: 40-60, gold: 6-10 } }
  preparing:
    play-area: { region: team }
    break-blocks: { blacklist: [bedrock, barrier], place: true }
  fighting:
    play-area: { region: fighting }
    break-blocks: { blacklist: [bedrock, barrier], place: true }
    # Fills the arena's loot containers, which open up as the walls break: /mga arena example loot add op 100
    # Use style: christmas (a folder in loot/) to swap in a themed set of tables.
    loot: {}
stats: [combat]
quit: { then: die, rejoin-seconds: 120 }
hud:
  boss-bar:
    text:
      building: "<yellow>Making the land..."
      preparing: "<green>Prepare! <white>%time% <gray>until the walls drop"
      fighting: "<red>Fight! <gray>Last team standing wins"
# Players join one with /mg join the-wall <variant>; the land is made in a different style, with the same quota.
variants:
  desert:
    name: "<dark_red>The Wall <gold>(Desert)"
    features:
      building:
        terrain: { style: desert }
  snowy:
    name: "<dark_red>The Wall <white>(Snowy)"
    features:
      building:
        terrain: { style: snowy }

prefix: "<gray>「<gold>KOTH</gold>」 "
announce:
  # %time%: how long until it starts, %start%: when
  warning: "%prefix%<yellow>King of the Hill starts in <white>%time%</white>. <click:run_command:'/koth join'><gold>[Go there]</gold></click>"
  # %end%: when it ends
  started: "%prefix%<green>King of the Hill is on until <white>%end%</white>! <click:run_command:'/koth join'><gold>[Go there]</gold></click>"
  # %reason%: why, from restriction.*
  skipped: "%prefix%<red>King of the Hill is skipped: %reason%."
  ended: "%prefix%<gray>King of the Hill is over."
  # %player%
  captured: "%prefix%<gold>%player%</gold> <yellow>took the hill!"
  dropped: "%prefix%<gray>%player% left, so the hill is free."
restriction:
  min-online: "only %online% of the %needed% players needed are online"
placeholder:
  no-holder: "<gray>nobody"
  never: "<gray>not planned"
status:
  active: "%prefix%<green>Running. <white>Holder: <gold>%holder%</gold>, <white>%time_left%</white> left."
  inactive: "%prefix%<gray>Not running. Next: <white>%next_start%</white> (in %next_in%)."
  not-configured: "%prefix%<red>KOTH isn't set up; staff can see why in the log."
balance:
  # %points%
  own: "%prefix%<gray>You have <gold>%points%</gold> points."
  loading: "%prefix%<gray>Loading your points, try again."
join:
  in-match: "%prefix%<red>Leave your match first."
  done: "%prefix%<gray>Off you go."
shop:
  cost-line: "<gray>Cost: <gold>%cost%</gold> points"
  owned-line: "<green>You have this already"
  # %entry%: its icon name, %cost%
  bought: "%prefix%<green>You bought %entry% for <gold>%cost%</gold> points."
  # %points%: their balance
  too-poor: "%prefix%<red>That costs <gold>%cost%</gold>; you have <gold>%points%</gold> points."
  owned: "%prefix%<red>You have that already."
  in-match: "%prefix%<red>You can't shop while in a match."
  busy: "%prefix%<gray>Still buying your last pick…"
  unavailable: "%prefix%<red>The shop isn't set up; staff can see why in the log."
  failed: "%prefix%<red>Something went wrong; you kept your points."
  partly-failed: "%prefix%<red>Part of it couldn't be given; staff can see it in the log."
admin:
  reload-done: "%prefix%<green>Reloaded."
  # %problem%
  reload-problem: "%prefix%<red>%problem%"
  reload-kept: "%prefix%<yellow>%file% has problems, so the previous one stays in use."
  reload-unusable: "%prefix%<yellow>%file% has problems, so it isn't used."
  started: "%prefix%<green>Started KOTH."
  stopped: "%prefix%<green>Stopped KOTH."
  already-running: "%prefix%<red>KOTH is already running."
  not-running: "%prefix%<red>KOTH isn't running."
  # %player%, %amount%, %points%: their balance now
  points-given: "%prefix%<green>Gave <white>%player%</white> %amount% points; they have <gold>%points%</gold>."
  points-taken: "%prefix%<green>Took %amount% points from <white>%player%</white>; they have <gold>%points%</gold>."
  points-shown: "%prefix%<white>%player%</white> <gray>has <gold>%points%</gold> points."
  unknown-player: "%prefix%<red>No player called <white>%player%</white> has been here."
  state-running: "<green>running"
  state-idle: "<gray>idle"
  loaded: "<green>ok"
  not-loaded: "<red>not loaded"
  storage-failed: "%prefix%<red>The points storage failed; see the log."
  # The status lines: %state%, %holder%, %taker%, %progress%, %capture%, %next_start%, %online%, %config%, %shop%
  status: "%prefix%<gray>%state% <dark_gray>|</dark_gray> holder %holder% <dark_gray>|</dark_gray> taking: %taker% %progress%/%capture%s <dark_gray>|</dark_gray> next %next_start% <dark_gray>|</dark_gray> online %online% <dark_gray>|</dark_gray> config %config%, shop %shop%"

# Dunes with cacti and dead bushes.
shape:
  base: 40
  hills: {amplitude: 10, scale: 40, octaves: 4}
  detail: {amplitude: 2, scale: 12, octaves: 2}
  sea-level: 30
  deep-below: 12
  pad-radius: 5
  rock: stone
  deep-rock: deepslate
  floor: bedrock
surface:
  top: sand
  under: sandstone
  depth: 3-5
  shore: sand
  shore-under: sandstone
  lakebed: {sand: 3, gravel: 1}
caves: {width: 0.08, scale: 24, min-depth: 5, lava-level: 8}
ores:
  - ores/vanilla
# Quotas can count these together: `quota: {ores: 60-}`.
groups:
  ores: [coal_ore, iron_ore, copper_ore, gold_ore, redstone_ore, lapis_ore, diamond_ore,
         deepslate_coal_ore, deepslate_iron_ore, deepslate_copper_ore, deepslate_gold_ore,
         deepslate_redstone_ore, deepslate_lapis_ore, deepslate_diamond_ore]
trees: [{name: cacti, log: cactus, height: 2-4, count: 15-30, grows-on: [sand]}]
decor: [{name: bushes, blocks: {dead_bush: 1}, density: 0.03, stands-on: [sand]}]

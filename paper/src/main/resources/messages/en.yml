# Player-facing text, in MiniMessage: https://docs.papermc.io/adventure/minimessage/format
# %prefix% works in every message. Other placeholders are listed per message; <name>…</name> ones wrap text, e.g. to make it clickable.
prefix: "<gray>「<gradient:#FFB7C5:#FF5F9E:#FFB7C5>MiniGami</gradient><gray>」 "

join:
  # %player%: who tried to join
  already-in-match: "%prefix%<red>%player% is already in a match."
  name-a-player: "%prefix%<red>Who should join? <white>/mga join %game% %player% [variant]</white>"
  # %game%: the game as typed
  unknown-game: "%prefix%<red>Unknown game <white>%game%</white>. See <white>/mg list</white>."
  # %game%: the game's name, %variant%: as typed, %variants%: the ones it has
  unknown-variant: "%prefix%%game%<red> has no variant <white>%variant%</white>. Try: <white>%variants%</white>"
  # %player%: who may not play this game (a permission, minigami.play.<game>)
  not-allowed: "%prefix%<red>%player% can't play this game."
  # %game%: the game's or variant's name
  no-free-arena: "%prefix%<red>All arenas for %game%<red> are busy. Try again soon."
  # None of its arenas is set up for it yet; staff also hear why. %game%: the game's or variant's name
  not-ready: "%prefix%%game%<red> isn't ready to play yet."
  # Its file is there but did not load; staff also hear why. %game%: the game as typed
  unavailable: "%prefix%<white>%game%</white> <red>is unavailable right now."
  # The match a schedule opened is full or has started. %game%: its name
  match-full: "%prefix%%game%<red> is full or has already started."
  party-leader-only: "%prefix%<red>Only the party leader can join a game."
  # %size%: players in the party who are online, %max%: most players the game holds
  party-too-big: "%prefix%<red>Your party is too big (<white>%size%</white>/%max%)."
  # %size%: players in the party who are online, %team%: most players in a team
  party-too-big-for-team: "%prefix%<red>Your party doesn't fit in one team (<white>%size%</white>/%team%)."
  failed: "%prefix%<red>%player% can't join: items from a previous match weren't returned. Relog, or staff: <white>/mga player %player% snapshot restore</white>"

leave:
  not-in-match: "%prefix%<red>You're not in a match."
  other-not-in-match: "%prefix%<red>%player% is not in a match."

start:
  nothing-to-start: "%prefix%<red>No match is waiting to start."
  started: "%prefix%<green>Match started."

# %player%: the player, %players%: how many joined, %needed%: how many are needed to start
match:
  joined: "%prefix%<white>%player%</white> <gray>joined <dark_gray>(<white>%players%</white>/%needed%)"
  # A player ran out of lives.
  eliminated: "%prefix%%player% <red>has been eliminated!"
  # Instead of going out, joins the role the game names in on-out. %team%: that role's name
  switched-role: "%prefix%<white>%player%</white> <gray>has joined the %team%<gray>!"
  # %seconds%: delay before the start
  starting: "%prefix%<green>Starting in <white>%seconds%</white> seconds."
  start-cancelled: "%prefix%<red>Start cancelled: not enough players."
  # %player%: the player who left
  left: "%prefix%<white>%player%</white> <gray>left the match."
  you-left: "%prefix%<gray>You left the match."
  # A participant quit the server but may still come back. %player%, %seconds%: how long they have
  away: "%prefix%<white>%player%</white> <gray>disconnected (<white>%seconds%</white>s to return)."
  # %player%: who came back in time
  back: "%prefix%<white>%player%</white> <green>is back."
  # %player%: who didn't come back in time
  away-expired: "%prefix%%player% <red>didn't return and is out!"
  # The death message of a participant whose game kills them for quitting. %player%
  died-quitting: "<red>%player%</red> <gray>rage quit the match"
  # Above the hotbar while a player waits to respawn (respawn-seconds). %seconds%: how long the wait is
  respawning: "<gray>Respawning in <gold>%seconds%</gold> seconds"
  # %player%: the winner
  winner: "%prefix%<gold>%player%</gold> <gray>won the match!"
  # Above the hotbar in the last seconds of a phase with the countdown feature. %seconds%: seconds left
  countdown: "<gray>Ending in <gold>%seconds%</gold>"
  # %players%: the winning team's players, each in the team's colour. %team%: the team's name, in its colour
  winner-team: "%prefix%%players% <gray>won the match!"
  no-winner: "%prefix%<gray>Nobody won."
  # %team%: the player's team, in its colour
  your-team: "%prefix%<gray>You're on team %team%<gray>!"
  # %team%: the player's role, in its colour
  your-role: "%prefix%<gray>You're playing as %team%<gray>!"
  # Only when an admin stops it with the command.
  stopped: "%prefix%<red>An admin stopped the match."
  paused: "%prefix%<yellow>An admin paused the match."
  resumed: "%prefix%<green>The match continues."
  # For admins. %match%: a match's id, its arena; %game%: the game and any variant, %phase%, %players%: how many are in it
  admin:
    none: "%prefix%<gray>No matches are running."
    # %count%
    list: "%prefix%<gold>Matches</gold> <gray>(%count%):"
    entry: "<gray> - <info><hover:show_text:'Show details'><white>%match%</white></hover></info> <gray>%game%, %phase%, <white>%players%</white> players"
    # %game%: its name, %gametype%, %seconds%: since it opened
    info: "%prefix%<gold>%match%</gold> <gray>(%game%<gray>, %gametype%) in phase <white>%phase%</white> after %seconds% s:"
    # %player%, %team%: the team line below or nothing, %state%, %points%; <kick>…</kick> fills in the kick command
    player: "<kick><hover:show_text:'Click to kick'><gray> - %team%<white>%player%</white> %state% <gray>%points% points</hover></kick>"
    # %team%: the team's name
    team: "%team% "
    state-alive: "<green>playing"
    state-out: "<red>out"
    state-left: "<dark_gray>left"
    unknown: "%prefix%<red>No match is running in <white>%match%</white>."
    cannot-start: "%prefix%<red><white>%match%</white> has already started or has no players."
    cannot-end: "%prefix%<red><white>%match%</white> hasn't started or is already ending; stop it instead with <white>/mga match %match% stop</white>."
    started: "%prefix%<red><white>%match%</white> has already started; players can only be added before."
    ended: "%prefix%<green>Ended <white>%match%</white>; the win condition decided the result."
    stopped: "%prefix%<green>Stopped <white>%match%</white> without a result."
    paused: "%prefix%<green>Paused <white>%match%</white>; resume it with <white>/mga match %match% resume</white>."
    # %seconds%: the countdown before play goes on
    resumed: "%prefix%<green>Resuming <white>%match%</white> in %seconds% seconds."
    already-resuming: "%prefix%<red><white>%match%</white> is already counting down to go on."
    already-paused: "%prefix%<red><white>%match%</white> is already paused."
    not-paused: "%prefix%<red><white>%match%</white> isn't paused."
    # %phase%: the phase asked for, %phases%: those it can skip to
    phase-skipped: "%prefix%<green>Skipped <white>%match%</white> to <white>%phase%</white>."
    no-later-phase: "%prefix%<red><white>%match%</white> has no phase <white>%phase%</white> ahead; it can skip to: <white>%phases%</white>."
    added: "%prefix%<green>Added <white>%player%</white> to <white>%match%</white>."
    kicked: "%prefix%<green>Kicked <white>%player%</white> from <white>%match%</white>."
    not-member: "%prefix%<red><white>%player%</white> isn't in <white>%match%</white>."

# Team names by id; teams are handed out in this order, and the id is also the team's colour.
team:
  red: "<red>Red"
  blue: "<blue>Blue"
  green: "<green>Green"
  yellow: "<yellow>Yellow"
  aqua: "<aqua>Aqua"
  light_purple: "<light_purple>Pink"
  gold: "<gold>Orange"
  white: "<white>White"
  dark_green: "<dark_green>Dark Green"
  dark_blue: "<dark_blue>Dark Blue"
  dark_aqua: "<dark_aqua>Teal"
  dark_purple: "<dark_purple>Purple"
  gray: "<gray>Gray"
  dark_gray: "<dark_gray>Dark Gray"
  black: "<black>Black"
  dark_red: "<dark_red>Dark Red"

hide-and-seek:
  # When the hunted get their head start; worded for any roles, such as infection's. %seconds%: how long it lasts
  hiding: "%prefix%<green>Hide! <gray>The hunt starts in <white>%seconds%</white>s."
  # When the hunters are let go. %seconds%: how long the hunted must last
  seeking: "%prefix%<red>The hunt is on! <gray>Survive <white>%seconds%</white>s."
paint:
  # A team, or a player without teams, took the lead alone. %team%: its name, %blocks%: the blocks it holds
  leader: "%prefix%%team% <gray>takes the lead with <white>%blocks%</white> blocks!"

domination:
  # A team, or a player without teams, took a capture point. %team%: its name, %point%: the point's name
  taken: "%prefix%%team% <gray>captured %point%<gray>!"
  # Action bar every second: one text per point, between separators; which one depends on the point's state. %point%: its name
  # Owned and nobody is taking it. %team%: who owns it
  holding: "%team% <gray>holds %point%"
  separator: "<dark_gray>  |  "
  # A team stands on it alone to take it. %team%: its name, %seconds% of %needed%
  capturing: "%team% <gray>is capturing %point% <dark_gray>(<white>%seconds%/%needed%s</white>)"
  # Teams on it at the same time
  contested: "%point% <red>is contested!"
  # Nobody owns it
  free: "%point% <gray>is up for grabs"
the-wall:
  # When teams are let loose in their part of the arena. %minutes%: until the walls drop
  preparing: "%prefix%<green>Prepare! <gray>The walls fall in <white>%minutes%</white> min."
  dropped: "%prefix%<red>The walls have fallen! <gray>Last team standing wins."
pole-duel:
  # When every player stands on a pole
  built: "%prefix%<green>Bridge across with slabs and knock the others off! <gray>Touch the ground and you are out."
  no-room: "%prefix%<red>The arena has no room for a pole each, so the match is called off."
shifting-maze:
  # When the runners are let loose. %seconds%: until the Minotaurs wake
  head-start: "%prefix%<green>Run! <gray>The Minotaurs wake in <white>%seconds%</white>s."
  # When the Minotaurs are let go. %keys%: how many keys each team needs
  running: "%prefix%<red>The Minotaurs are loose! <gray>Find your team's <white>%keys%</white> keys, then reach the centre."
  # The same moments, to the Minotaurs
  head-start-minotaur: "%prefix%<red>You are a Minotaur! <gray>You wake in <white>%seconds%</white>s. Catch the runners before they reach the centre."
  running-minotaur: "%prefix%<red>Hunt them! <gray>Catch every runner before their team gets all <white>%keys%</white> keys and reaches the centre."
  too-small: "%prefix%<red>This arena's maze region is too small for this game."
  # When walls are about to move
  # Action bar near a wall about to move. %seconds%: until it does
  shift-countdown: "<gold>The walls shift in <white>%seconds%</white>s"
  # After the walls have moved
  # To a team when a member takes one of its keys. %player%: who; %found%: keys the team has; %keys%: keys it needs
  key-found: "%prefix%%player% <gray>found a key (<gold>%found%</gold>/<gold>%keys%</gold>)."
  # Action bar for runners. %found%/%keys%: the team's keys; %out%/%free%: members out of the maze of those still free
  keys-bar: "<gold>Keys %found%/%keys% <gray>· <green>Out %out%/%free%"
  # Action bar at the exit of a team without all its keys. %left%: keys it still needs
  exit-locked: "<red>Your team needs <white>%left%</white> more keys"
  # To a team when a member gets out. %player%: who; %out%/%free%: members out of those still free
  member-out: "%prefix%%player% <green>is out! <gray>(%out%/%free%) The rest of your team must follow."
  # Action bar when a Minotaur tries to enter the exit room
  # To everyone when the last free member of a team is out. %team%: the team
  escaped: "%prefix%%team% <green>escaped the maze!"
item-race:
  # When play starts. %item%: the item(s) every player is after
  target: "%prefix%<gold>Find <white>%item%</white> <gold>and drop it so it lands in a deposit! <gray>The first to hand it in wins."
  # Action bar every second
  target-bar: "<gold>Find <white>%item%</white> <gray>and drop it in a deposit"
  # To a player who right clicks a deposit with something else. %item%: the item(s) the deposit still wants from their team
  wrong: "<red>The deposit wants <white>%item%"
  # To everyone, on every hand-in. %player%: who, %item%, %done% and %total%: the team's progress
  deposited: "%prefix%%player% <green>deposited <white>%item%</white> <gray>(%done%/%total%)"
  # Action bar to a player whose team handed in too recently. %seconds%: how long until it counts again
  cooldown: "<red>Your team must wait <white>%seconds%s</white> before the next hand-in"
  # HUD lines (%item%, %item1% to %item5%) for one target; handed in or still to find
  entry-done: "<green>✔ <strikethrough>%item%"
  entry-open: "<white>%item%"
king:
  # At the start, to the King's team. %king%: the King
  chosen: "%prefix%<gold>%king% <gray>is your King! Keep them alive: <white>while the King lives, you come back."
  # When a King dies. %team%: their team, %king%: the King
  died: "%prefix%%team%<red>'s King %king% <red>has fallen!"
  # To the rest of that team
  last-life: "%prefix%<red>Your King has fallen. <gray>Your deaths count from now on."
  # When time ran out with both teams still standing
  time-up: "%prefix%<gray>Time is up! <white>The King, the survivors and the kills decide."
team-deathmatch:
  # After a kill. %team%: the killer's team, or the killer without teams; %kills%: its kills so far
  kills: "%prefix%%team% <gray>is on <gold>%kills%</gold> kills!"

build-battle:
  # %theme%: the theme, %seconds%: build time
  theme: "%prefix%<gray>Theme: <gold>%theme%</gold> <dark_gray>- <white>%seconds%</white>s to build."
  free-build: "%prefix%<gold>Free build! <white>%seconds%</white><gray>s to build."
  # %player%: whose build everyone is looking at: the team's name, or the builder's without teams
  showing: "%prefix%<gray>Judging the build of <white>%player%</white><gray>. Vote with your hotbar."
  # %score%: 1 to 5
  vote-item: "<yellow>Vote %score%"
  voted: "%prefix%<green>Voted <white>%score%</white>."
  own-build: "%prefix%<red>You can't vote for your own build."
  # %player%, %points%: a team's or builder's total, best first
  score: "<gray> - <white>%player%</white><gray>: <gold>%points%</gold> points"

plot-mobs:
  # %max%: the most mobs one plot can hold
  limit: "%prefix%<red>Plot mob limit reached (<white>%max%</white>)."

# What players see of a match next to chat; the sidebar and boss bar are set in config.yml and the games.
hud:
  # %scores% in a sidebar: a line per team, or without teams the top three players. A team's line also has %alive%
  # (its members still in, instead of the match's) and %size%, for games without points, which can say in their own file:
  #   messages: { hud: { scores: { team: "%team%<gray>: <white>%alive% left" } } }
  scores:
    team: "%team%<gray>: <white>%points%"
    player: "<gray>%place%. <white>%player% <dark_gray>- <yellow>%points%"
  # %floors% in a sidebar: a line per floor with players on it, the highest first, with %level% and %players%.
  floors:
    own: "<yellow>Level %level%<gray>: <white>%players% <yellow>◀"
    other: "<gray>Level %level%: <white>%players%"
  # Every title can use the match's values too, such as %game% or %lives%.
  title:
    countdown: "<gold><bold>%seconds%"
    countdown-subtitle: "<gray>Get ready!"
    start: "<green><bold>GO!"
    start-subtitle: "<gray>Good luck!"
    out: "<red><bold>ELIMINATED"
    out-subtitle: "<gray>You're spectating now"
    win: "<gold><bold>VICTORY!"
    win-subtitle: "<yellow>You won the match"
    # 2nd and 3rd place. %place%
    podium: "<aqua><bold>#%place% PLACE"
    podium-subtitle: "<gray>Well played!"
    lose: "<red><bold>MATCH OVER"
    lose-subtitle: "<gray>You finished <white>#%place%"
    lose-subtitle-unplaced: "<gray>Better luck next time!"
    paused: "<yellow><bold>PAUSED"
    paused-subtitle: "<gray>An admin paused the match"

# /mg list. %game%: a game's or variant's name, %players%: how many are in its matches; <join>…</join> joins on click
list:
  header: "%prefix%<gold>Games you can join:"
  game: "<gray> - <join><hover:show_text:'Click to join'>%game%</hover></join> <gray>(<white>%players%</white> playing)"
  variant: "<gray>    - <join><hover:show_text:'Click to join'>%game%</hover></join> <gray>(<white>%players%</white> playing)"
  none: "%prefix%<gray>No games to join right now."

# /mg stats and /mg leaderboard. %player%: a player's name, %game%: a game's name or the id typed, %gametype%: a game type's id,
# %stat%: a stat's name from below; totals: %played%, %wins%, %place%: average place or -, %left%: matches left early, %minutes% played
stats:
  name-a-player: "%prefix%<red>Usage: <white>/mg stats [player]</white>"
  loading: "%prefix%<gray>Loading stats of <white>%player%</white><gray>, try again."
  failed: "%prefix%<red>Couldn't load the stats."
  unknown-player: "%prefix%<white>%player%</white> <red>hasn't played here yet."
  unknown-game: "%prefix%<red>There is no game called <white>%game%</white>."
  unknown-variant: "%prefix%<red>%game% <red>has no variant called <white>%variant%</white>; it has: <white>%variants%</white>."
  unknown-stat: "%prefix%<red>%game% <red>has no leaderboard called <white>%stat%</white>."
  header: "%prefix%<gold>%player%</gold><gray>'s stats:"
  none: "<gray> No matches played yet."
  game: "<gray> - %game%<gray>: %played% played, %wins% won, %losses% lost, average place %place%, %minutes% min"
  game-header: "%prefix%<gold>%player%</gold><gray> in %game%<gray>:"
  game-totals: "<gray> %played% played, %wins% won, %losses% lost, average place %place%, left %left%, %minutes% min"
  # A line per variant played, under the game's totals and stats
  variant: "<gray> - %variant%<gray>: %played% played, %wins% won, %losses% lost, average place %place%, %minutes% min"
  # A game's kept stats on a line under it in /mg stats: %stats% is each stat-inline, between separators
  game-stats: "<gray>    %stats%"
  # %stat%, %amount%
  stat-inline: "<gray>%stat% <white>%amount%"
  separator: "<dark_gray> | "
  # %amount%
  stat: "<gray> - %stat%: <white>%amount%"
  top-header: "%prefix%<gold>Top %stat%</gold> <gray>in %game%<gray>:"
  # %position%, %amount%
  top-entry: "<gray> %position%. <white>%player%</white>: <gold>%amount%"
  top-none: "<gray> Nobody yet."
  # On a board, for a player whose name isn't known
  unknown-name: "<dark_gray>unknown player"
  admin:
    changed: "%prefix%<gray>%player%<gray>'s <white>%stat%</white> in <white>%game%</white> is now <gold>%amount%</gold>."
    confirm: "%prefix%<red>That can't be undone. Add <white>confirm</white> at the end of the command to do it."
    reset-player: "%prefix%<gray>Cleared the <white>%game%</white> stats of <white>%player%</white> (* is every game)."
    reset-game: "%prefix%<gray>Cleared everyone's stats in <white>%game%</white>."
  # A stat's display name by its id; a game's own stats need one here too.
  name:
    wins: "wins"
    played: "games played"
    points: "points"
    kills: "kills"
    deaths: "deaths"
    point-seconds: "seconds on a capture point"
    keys: "keys found"
    escapes: "escapes"
    catches: "runners caught"
    blocks-painted: "blocks painted"
    blocks-stolen: "blocks stolen"
    items-handed-in: "items handed in"
    king-kills: "kings killed"

lobby:
  none: "%prefix%<red>No lobby set. Use <white>/mga lobby set</white>."

# Arena setup. %arena%: the arena id, %world%: its world, %number%: a spawn's number as listed by info
arena:
  unknown: "%prefix%<red>There is no arena called <white>%arena%</white>."
  exists: "%prefix%<red>An arena called <white>%arena%</white> already exists."
  invalid-id: "%prefix%<red><white>%arena%</white> can't be an arena id: use lower case letters, digits and dashes."
  in-use: "%prefix%<red>A match is running in <white>%arena%</white>; change it once the match has ended."
  other-world: "%prefix%<red><white>%arena%</white> is in world <white>%world%</white>; go there to set its points."
  no-spawn: "%prefix%<red><white>%arena%</white> has no spawn <white>%number%</white>."
  created: "%prefix%<green>Created arena <white>%arena%</white> in <white>%world%</white>. Add spawns with <white>/mga arena %arena% spawn add</white>."
  spawn-added: "%prefix%<green>Added spawn <white>%number%</white> to <white>%arena%</white>."
  spawn-removed: "%prefix%<green>Removed spawn <white>%number%</white> from <white>%arena%</white>."
  # %spawns%: how many spawns
  info: "%prefix%<gold>%arena%</gold> <gray>in <white>%world%</white>, <white>%spawns%</white> spawns. Click a point to go there."
  # %x%, %y%, %z%; wrap text in <teleport>…</teleport> to make it teleport on click
  info-spawn: "<gray> - <teleport><hover:show_text:'Teleport'><white>spawn %number%</white>%team%: %x%, %y%, %z%</hover></teleport>"
  # %team%: the team's name; shown after a spawn that only that team uses
  spawn-team: " <gray>(%team%<gray>)"
  # %team%: what was typed, %teams%: the team colours; a role's id works too
  unknown-team: "%prefix%<red><white>%team%</white> is neither a team (<white>%teams%</white>) nor a role id in lower case letters, digits and dashes."
  info-waiting-spot: "<gray> - <teleport><hover:show_text:'Teleport'><white>waiting spot</white>: %x%, %y%, %z%</hover></teleport>"
  no-spawns: "%prefix%<gray><white>%arena%</white> has no spawns yet; add one with <white>/mga arena %arena% spawn add</white>."
  info-spectator-spot: "<gray> - <teleport><hover:show_text:'Teleport'><white>spectator spot</white>: %x%, %y%, %z%</hover></teleport>"
  info-no-spectator-spot: "<gray> - no spectator spot; players who are out spectate where they fell"
  info-respawning-spot: "<gray> - <teleport><hover:show_text:'Teleport'><white>respawning spot</white>: %x%, %y%, %z%</hover></teleport>"
  info-no-respawning-spot: "<gray> - no respawning spot; players waiting to respawn spectate at the spawn they will get"
  info-no-waiting-spot: "<gray> - no waiting spot; players wait at spawn 1"
  # %region%: its name; %from%, %to%: its lowest and highest corner block
  info-region: "<gray> - <white>region %region%</white>: %from% to %to%"
  # %from%, %to%: the lowest and highest corner block of the box it is pasted into
  info-map: "<gray> - <white>map</white>: %from% to %to%; pasted back after each match"
  info-no-map: "<gray> - no saved map; save one from a WorldEdit selection with <white>/mga arena %arena% map save</white>"
  # Containers that fill with loot when a match uses them. %arena%: the arena, %table%: the tables and chance a container uses,
  # %x%, %y%, %z%: a container, %count%: how many containers
  loot:
    added: "%prefix%<green>The container at <white>%x%, %y%, %z%</white> of <white>%arena%</white> now fills from <white>%table%</white>."
    added-many: "%prefix%<green><white>%count%</white> containers of <white>%arena%</white> now fill from <white>%table%</white>."
    removed: "%prefix%<green>The container at <white>%x%, %y%, %z%</white> of <white>%arena%</white> no longer fills."
    removed-many: "%prefix%<green><white>%count%</white> containers of <white>%arena%</white> no longer fill."
    not-set: "%prefix%<red>The container at <white>%x%, %y%, %z%</white> of <white>%arena%</white> does not fill with loot."
    none: "%prefix%<gray><white>%arena%</white> has no loot containers yet; look at a chest and use <white>/mga arena %arena% loot add <table></white>."
    list: "%prefix%<gold>%arena%</gold> <gray>has <white>%count%</white> loot containers. Click one to go there."
    # %table% is the tables the container fills from
    entry: "<gray> - <teleport><hover:show_text:'Teleport'><white>%x%, %y%, %z%</white>: %table%</hover></teleport>"
    entry-unknown: "<gray> - <teleport><hover:show_text:'Teleport'><red>%x%, %y%, %z%: %table% (a table is missing)</red></hover></teleport>"
    showing: "%prefix%<green>Showing the loot containers of <white>%arena%</white> for <white>%seconds%</white> seconds."
    # %most%: the most blocks a selection may hold
    selection-too-big: "%prefix%<red>That selection is too big; it may hold at most <white>%most%</white> blocks."
    no-container-in-selection: "%prefix%<red>There is no chest, barrel or shulker box in your selection."
    none-in-selection: "%prefix%<red>No container in your selection fills with loot in <white>%arena%</white>."
    look-at-container: "%prefix%<red>Look at a chest, barrel or shulker box."
    # %spec%: what was typed
    invalid-spec: "%prefix%<red><white>%spec%</white> is not a loot choice; write a table such as <white>castle/a</white>, a mix such as <white>ice/rare:70 ice/op:30</white>, and optionally a chance such as <white>50%</white>."
    unknown-table: "%prefix%<red>There is no loot table <white>%table%</white>; see the files in <white>plugins/MiniGami/loot</white>."
    marking: "%prefix%<green>Right click containers of <white>%arena%</white> to fill them from <white>%table%</white>; sneak and right click to stop one. <white>/mga arena %arena% loot mark off</white> ends this."
    marking-stopped: "%prefix%<gray>You are no longer marking containers."
  # %count%: how many containers
  info-loot: "<gray> - <white>%count%</white> loot containers; see <white>/mga arena %arena% loot list</white>"
  # Named boxes games use, saved from a WorldEdit selection. %region%: its name
  region:
    invalid-name: "%prefix%<red><white>%region%</white> can't be a region name: use lower case letters, digits and dashes, and not <white>team</white>."
    no-selection: "%prefix%<red>Select the region with WorldEdit first, for example with <white>//wand</white>."
    # %from%, %to%: its lowest and highest corner block
    saved: "%prefix%<green>Saved region <white>%region%</white> of <white>%arena%</white>: %from% to %to%."
    removed: "%prefix%<green>Removed region <white>%region%</white> from <white>%arena%</white>."
    unknown: "%prefix%<red><white>%arena%</white> has no region <white>%region%</white>."
    none: "%prefix%<gray><white>%arena%</white> has no regions yet; select one with WorldEdit and save it with <white>/mga arena %arena% region %name% set</white>."
    showing: "%prefix%<gray>Showing region <white>%region%</white> for %seconds% seconds."
    # What a game may turn the region into, such as a crumbled wall; pasted with its lowest corner on the region's
    schematic-loaded: "%prefix%<green>Region <white>%region%</white>'s schematic is on your WorldEdit clipboard; <white>//paste</white> places it."
    schematic-pasted: "%prefix%<green>Pasted what region <white>%region%</white> turns into. The arena's map reset (<white>/mga arena map reset</white>) undoes it."
    no-schematic: "%prefix%<red>Region <white>%region%</white> has no schematic; select one and use <white>/mga arena <arena> region %region% schematic</white>."
    schematic-saved: "%prefix%<green>Saved what region <white>%region%</white> turns into. Make it the region's size."
  # The arena's map: a WorldEdit schematic pasted back after each match and at startup
  map:
    no-worldedit: "%prefix%<red>This needs WorldEdit or FastAsyncWorldEdit."
    no-selection: "%prefix%<red>Select the arena with WorldEdit first, for example with <white>//wand</white>."
    saved: "%prefix%<green>Saved the map of <white>%arena%</white>; it is pasted back after each match."
    save-failed: "%prefix%<red>Could not save the map of <white>%arena%</white>; the server log says why."
    load-failed: "%prefix%<red>Could not load the schematic of <white>%arena%</white>; the server log says why."
    none: "%prefix%<red><white>%arena%</white> has no saved map; save one with <white>/mga arena %arena% map save</white>."
    resetting: "%prefix%<red>The map of <white>%arena%</white> is already being reset."
    reset: "%prefix%<green>Reset the map of <white>%arena%</white>."
    reset-failed: "%prefix%<red>Could not reset the map of <white>%arena%</white>; the server log says why."
  # %arena%: an arena; %style%: a terrain style; %group%: a region group; %seed%: the seed of the land
  terrain:
    unknown-style: "%prefix%<red>There is no terrain style <white>%style%</white>; a style is a file in terrain/."
    no-regions: "%prefix%<red><white>%arena%</white> has no regions in the group <white>%group%</white>."
    generating: "%prefix%<gray>Making <white>%style%</white> land in <white>%arena%</white> with seed <white>%seed%</white>..."
    placed: "%prefix%<green>The land is in <white>%arena%</white>; <white>/mga arena %arena% map reset</white> puts the old blocks back."
    failed: "%prefix%<red>Could not place the land in <white>%arena%</white>; the server log says why."

# %command%: a command; click a line to put it in the chat box
help:
  header: "%prefix%<gold>%command%</gold> <gray>can be followed by:"
  line: "<suggest><hover:show_text:'Click to fill in'><gray> - <white>%command%</white></hover></suggest>"

# Lists and details for admins. <info>…</info> shows an entry's details on click, <set>…</set> fills in a set command.
info:
  # %count%; per entry %id%, %status%, and %gametype% and %variants%, %world% and %spawns%, or %games%: how many games use it
  games: "%prefix%<gold>Games</gold> <gray>(%count%):"
  game-entry: "<gray> - <info><hover:show_text:'Show details'><white>%id%</white></hover></info> <gray>%gametype%, %variants% variant(s), %status%"
  arenas: "%prefix%<gold>Arenas</gold> <gray>(%count%):"
  arena-entry: "<gray> - <info><hover:show_text:'Show details'><white>%id%</white></hover></info> <gray>in %world%, %spawns% spawns, %status%"
  gametypes: "%prefix%<gold>Game types</gold> <gray>(%count%):"
  gametype-entry: "<gray> - <info><hover:show_text:'Show details'><white>%id%</white></hover></info> <gray>used by %games% game(s)"
  features: "%prefix%<gold>Features</gold> <gray>(%count%):"
  feature-entry: "<gray> - <info><hover:show_text:'Show details'><white>%id%</white></hover></info> <gray>used by %games% game(s)"
  status:
    ok: "<green>ready"
    # %problems%: how many
    problems: "<red>%problems% problem(s)"
    not-loaded: "<yellow>not loaded; /mga reload"
    disabled: "<gray>disabled; /mga game %id% enable"
    no-arenas: "<yellow>no playable arena; /mga doctor %id% says why"
    no-spawns: "<yellow>no spawns"
    in-use: "<aqua>in use"
  # %count%; per entry %id%, %name%, %games%: how many are in the playlist, and %status%
  nights: "%prefix%<gold>Game nights</gold> <gray>(%count%):"
  night-entry: "<gray> - <info><hover:show_text:'Show details'><white>%id%</white></hover></info> <gray>%name%<gray>, %games% game(s), %status%"
  # %name%: the night's display name
  night: "%prefix%<gold>%id%</gold> <gray>(%name%<gray>), %status%"
  schedules: "%prefix%<gold>Schedules</gold> <gray>(%count%):"
  # %when%: its cron line, %games%: how many games it picks from
  schedule-entry: "<gray> - <info><hover:show_text:'Show details'><white>%id%</white></hover></info> <gray>%name%<gray>, <white>%when%</white>, %games% game(s), %status%"
  schedule: "%prefix%<gold>%id%</gold> <gray>(%name%<gray>), %status%"
  # %count%
  night-playlist: "<gray> Playlist (%count%):"
  # %n%: its position, %game%, %variant% and %points%: empty when the entry has none
  night-playlist-entry: "<gray>  %n%. <white>%game%</white>%variant%<gray>%points%"
  # %name%: the game's display name
  game: "%prefix%<gold>%id%</gold> <gray>(%name%<gray>) plays <white>%gametype%</white>, %status%"
  # %variants%: each a game-variant
  game-variants: "<gray> Variants: %variants%"
  # %id%, %name%: the variant's
  game-variant: "<white>%id%</white> <gray>(%name%<gray>)"
  game-arenas: "<gray> Playable arenas: <white>%arenas%"
  # %count%
  game-teams-count: "<gray> Teams: <white>%count%</white>, formed at random when the match starts"
  # %size%: players per team
  game-teams-size: "<gray> Teams: of <white>%size%</white> players each, formed at random when the match starts"
  # %roles%: the roles' names, in the order they are handed out
  game-roles: "<gray> Roles: %roles%<gray>, handed out at random when the match starts"
  # %key%, %value%
  value: "<set><hover:show_text:'Click to change'><gray> - <white>%key%</white>: <yellow>%value%</yellow></hover></set>"
  value-inherited: "<set><hover:show_text:'Click to change'><dark_gray> - %key%: %value%</hover></set>"
  # %keys%: clickable
  unset: "<gray> Not set: <white>%keys%"
  config: "%prefix%<gold>%file%</gold><gray>:"
  # %win-condition%, %lives%: default lives, 0 means always respawn
  gametype: "%prefix%<gold>%id%</gold> <gray>is won by <white>%win-condition%</white>; lives: <white>%lives%</white>. Phases:"
  # %roles%: the role ids the game needs
  gametype-roles: "<gray> Its games define the roles <white>%roles%</white> under <white>roles.%id%</white>."
  gametype-regions: "<gray> Its arenas need the regions <white>%regions%</white>."
  # %region%: the name every team's region starts with
  gametype-region-per-team: "<gray> Its arenas need a region per team: <white>%region%-1</white>, <white>%region%-2</white>, and so on."
  # %group%: the name the regions start with
  gametype-region-group: "<gray> Its arenas need one or more <white>%group%</white> regions, each named <white>%group%</white> or <white>%group%-</white>anything, such as <white>%group%-north</white>."
  phase-timed: "<gray> - <white>%phase%</white> for %seconds% s"
  phase-untimed: "<gray> - <white>%phase%</white> until it ends"
  feature: "%prefix%<gold>%id%</gold><gray>, set per phase under <white>features.%phase%.%id%</white>:"
  # %key%, %values%: what it can be
  setting: "<gray> - <white>%key%</white>: %values%"
  setting-required: "<gray> - <white>%key%</white> <red>(required)</red>: %values%"
  any-value: "<dark_gray>any value"
  no-settings: "<gray> No settings of its own."
  # %games%: clickable
  used-by: "<gray> Used by: <white>%games%"
  used-by-none: "<gray> Not used by any game."
  unknown-gametype: "%prefix%<red>There is no game type called <white>%id%</white>."
  unknown-feature: "%prefix%<red>There is no feature called <white>%id%</white>."

# %matches%, %listeners%, %snapshots%; per match: %gametype%, %game%, %arena%, %phase%, %members%, %alive%, %tick%
reload:
  done: "%prefix%<green>Config loaded: <white>%arenas%</white> arenas, <white>%games%</white> games, <white>%nights%</white> game nights."
  failed: "%prefix%<red>Config not loaded, the old one stays in use. <white>%problems%</white> problem(s):"
  problem: "<red> - %problem%"
  skipped: "%prefix%<yellow><white>%problems%</white> file(s) have problems and were left out. <white>/mga reload</white> shows them again:"
  # %findings%: how many arena problems leave an arena out of a game
  findings: "%prefix%<yellow><white>%findings%</white> arena problem(s) keep games out of arenas; <click:run_command:'/mga doctor'><hover:show_text:'Click to see them'><white>/mga doctor</white></hover></click> lists them."

edit:
  invalid-id: "%prefix%<red><white>%id%</white> can't be an id: use lower case letters, digits and dashes."
  unknown: "%prefix%<red>There is no <white>%file%</white>."
  exists: "%prefix%<red><white>%file%</white> already exists."
  here-needs-player: "%prefix%<red>Only a player can use <white>here</white> as a value."
  bad-value: "%prefix%<red><white>%value%</white> isn't a value; put text in quotes, e.g. <white>\"%value%\"</white>."
  invalid: "%prefix%<red>Not saved: <white>%file%</white> would have these problems:"
  problem: "<red> - %problem%"
  save-failed: "%prefix%<red>Could not save <white>%file%</white>; see the server log."
  set: "%prefix%<green>Set <white>%key%</white> in <white>%file%</white>."
  unset: "%prefix%<green>Removed <white>%key%</white> from <white>%file%</white>."
  created: "%prefix%<green>Created <white>%file%</white>. Change it with <white>set</white> and <white>unset</white>."
  deleted: "%prefix%<green>Deleted <white>%file%</white>. A copy is kept as <white>%file%.deleted</white> until the next delete of it."
  schedule-created: "%prefix%<green>Created <white>%file%</white>. Change its games, times and rewards with <white>set</white> and <white>unset</white>."
  night-created: "%prefix%<green>Created <white>%file%</white>. Add games with <white>playlist add</white>, and change the rest with <white>set</white> and <white>unset</white>."
  # %game%, %n%: the position of the entry, %to%: the position it moved to
  playlist-added: "%prefix%<green>Added <white>%game%</white> to the playlist of <white>%file%</white>."
  playlist-removed: "%prefix%<green>Removed game <white>%n%</white> from the playlist of <white>%file%</white>."
  playlist-moved: "%prefix%<green>Moved game <white>%n%</white> of <white>%file%</white> to position <white>%to%</white>."
  playlist-points: "%prefix%<green>Changed the points of game <white>%n%</white> in <white>%file%</white>."
  # %variant%: the variant's id, %file%: its game's file
  unknown-variant: "%prefix%<red><white>%file%</white> has no variant <white>%variant%</white>."
  variant-created: "%prefix%<green>Added variant <white>%variant%</white> to <white>%file%</white>. Change it with <white>variant %variant% set</white>."
  variant-deleted: "%prefix%<green>Removed variant <white>%variant%</white> from <white>%file%</white>."

snapshot:
  none: "%prefix%<gray>%player% has no saved state."
  in-match: "%prefix%<red>%player% is in a match; their state comes back when they leave it."
  unreadable: "%prefix%<red>The saved state of %player% can't be read; the server log names the file to fix."
  saved: "%prefix%<gold>%player%</gold><gray>: state saved for a match, not given back yet."
  last: "%prefix%<gold>%player%</gold><gray>: state given back last."
  details: "<gray> %game-mode% at %x%, %y%, %z% in %world%, health %health%, food %food%, level %level%"
  items: "<gray> Items: <white>%items%"
  effects: "<gray> Effects: <white>%effects%"
  # The chest staff get from /mga player <player> snapshot (the lines above are for the console)
  view:
    title: "<dark_gray>%player%'s saved state"
    vitals: "<gold>Health and level"
    where: "<gold>Where they were"
    effects: "<gold>Effects"
  in-match-hint: "<gray> They are in a match; this comes back by itself when they leave it."
  restore-hint: "<gray> Give it back with <white>/mga player %player% snapshot restore</white>."
  restore-last-hint: "<gray> Put it back with <white>/mga player %player% snapshot restore</white>; their current state is kept, so doing it again undoes it."
  restored: "%prefix%<green>Gave %player% their saved state back."
  restored-last: "%prefix%<green>Put the last state of %player% back. Run it again to undo."
  restore-failed: "%prefix%<red>Could not give %player% their state back; see the server log."

# Saved kits: %name% is the kit's name, %items% how many slots it fills, %count% how many kits there are
kit:
  invalid-name: "%prefix%<red><white>%name%</white> can't be a kit name: use lower case letters, digits, dashes and underscores."
  empty: "%prefix%<red>Your inventory is empty, so there is nothing to save."
  saved: "%prefix%<green>Saved kit <white>%name%</white> <gray>(%items% slots)</gray>. Use it in a game with <white>kit: %name%</white>."
  save-failed: "%prefix%<red>Could not write kit <white>%name%</white> to disk; see the server log. It works until the server stops."
  none: "%prefix%<gray>There are no saved kits. Save your inventory with <white>/mga kit save [name]</white>."
  header: "%prefix%<gray>Saved kits (%count%):"
  entry: "<gray> - <white>%name%</white> (%items% slots)"
  unknown: "%prefix%<red>There is no saved kit called <white>%name%</white>."
  deleted: "%prefix%<green>Deleted kit <white>%name%</white>. A game that uses it reports that on the next <white>/mga reload</white>."
  delete-failed: "%prefix%<red>Could not delete the file of kit <white>%name%</white>; see the server log."

# Loot tables and the items they name. %table%: a table id, %name%: a saved item
loot:
  none: "%prefix%<gray>There are no loot tables; add files to <white>plugins/MiniGami/loot</white>."
  # %count%: tables, %styles%: the style folders, comma separated
  header: "%prefix%<gray>Loot tables (%count%); styles: <white>%styles%</white>:"
  entry: "<gray> - <white>%table%</white>"
  # %count%: how many, %names%: comma separated
  saved-header: "%prefix%<gray>Saved items (%count%): <white>%names%</white>"
  unknown: "%prefix%<red>There is no loot table <white>%table%</white>."
  # %pools%: how many pools it has
  info: "%prefix%<gold>%table%</gold> <gray>has %pools% pool(s):"
  # %rolls%: draws each time, such as 4-6, %chance%: how often the pool runs at all
  pool: "<gray> - <white>%rolls%</white> draw(s), runs <white>%chance%</white> of the time:"
  # %what%: an item, nested table or nothing; %chance%: its share of a draw, empty for a rolled item
  pool-entry: "<gray>     %chance% <white>%what%"
  rolled: "%prefix%<gray>Rolled <white>%table%</white>: %count% item(s)"
  rolled-nothing: "%prefix%<gray>Rolled <white>%table%</white> and got nothing."
  invalid-name: "%prefix%<red><white>%name%</white> can't be an item name: use lower case letters, digits, dashes and underscores."
  hold-an-item: "%prefix%<red>Hold the item you want to save."
  saved: "%prefix%<green>Saved the item you hold as <white>%name%</white>. Use it in a table with <white>{ saved: %name% }</white>."
  save-failed: "%prefix%<red>Could not write item <white>%name%</white> to disk; see the server log. It works until the server stops."
  unknown-item: "%prefix%<red>There is no saved item called <white>%name%</white>."
  deleted: "%prefix%<green>Deleted item <white>%name%</white>. A table that uses it reports that on the next <white>/mga reload</white>."
  delete-failed: "%prefix%<red>Could not delete the file of item <white>%name%</white>; see the server log."

# Parties: %player% and %leader% are names, %count% the size of the party;

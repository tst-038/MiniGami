# MiniGami settings.

# Where players wait for games with "waiting: lobby". Set it in-game with /mg lobby set, or here:
# lobby: { world: world, x: 0.5, y: 64, z: 0.5, yaw: 0, pitch: 0 }

# How many blocks a game may place per tick when it builds (terrain, walls) and FastAsyncWorldEdit is not
# installed. With FastAsyncWorldEdit every build is one edit off the main thread and this is not used.
# Lower it if the server lags while a match starts, raise it to start matches sooner.
blocks-per-tick: 8192

# What players see of a match next to chat. Every game gets this; a game file can override any part
# of it under its own hud: key, or turn it all off with hud: false.
#
# Texts are MiniMessage with the match's values: %game%, %arena%, %players%, %max%, %alive%, %time% (m:ss),
# and the viewer's %team%, %lives%, %points%, and for games that play in a region the floors left in it: %levels%, the viewer's %level% (1 is the highest) and the members alive on it, %on-level%, or a line of its own %floors% for a line per floor with players on it, and any stat such as %kills%. A game with roles also has %<role>% (members alive)
# and %<role>-out% (members out), such as %hider% and %hider-out%. A line naming a value with
# nothing to show is left out, such as %lives% when lives are unlimited, %time% while waiting for players,
# or a stat the game doesn't keep. PlaceholderAPI's placeholders work too when it is installed.
hud:
  # Lines per phase of the game; starting is the countdown before the start, default covers the phases
  # not listed, and [] hides the sidebar. "" is a blank line, %scores% the teams (or the top three) by points.
  sidebar:
    title: "<gray>「<gradient:#FFB7C5:#FF5F9E:#FFB7C5><bold>MiniGami</bold></gradient><gray>」"
    waiting:
      - ""
      - "<gray>Game: <white>%game%"
      - "<gray>Map: <white>%arena%"
      - ""
      - "<gray>Players: <white>%players%<gray>/<white>%max%"
      - "<gray>Waiting for players..."
    starting:
      - ""
      - "<gray>Game: <white>%game%"
      - "<gray>Map: <white>%arena%"
      - ""
      - "<gray>Players: <white>%players%<gray>/<white>%max%"
      - "<gray>Starting in <green>%time%"
    default:
      - ""
      - "<gray>Game: <white>%game%"
      - "<gray>Map: <white>%arena%"
      - "<gray>Time: <yellow>%time%"
      - ""
      - "<gray>Team: %team%"
      - "<gray>Lives: <red>%lives% ❤"
      - "<white>%kills% <gray>Kills"
      - ""
      - "%scores%"
  # Over the time left of a timed phase and before the start; a text per phase like the sidebar, a phase
  # without one shows no bar, and false hides it. Everyone sees the same bar, so only the match's values work.
  boss-bar:
    color: yellow
    text:
      starting: "<green>Starting in <white>%time%"
      ending: "<gray>Back in <white>%time%"
      default: "<yellow>Time left: <white>%time%"
  # The 3-2-1 before the start, GO, being out, and winning or losing. true or false, or the timing of all but the
  # 3-2-1 in ticks, each optional: titles: { fade-in: 10, stay: 70, fade-out: 20 }. A game or variant that sets
  # only some of them keeps the rest from here (or the defaults above, if this is true), and one that sets true or
  # false replaces all of it.
  titles: true
  # Fireworks over the winners.
  fireworks: true
  # Any Minecraft sound, or false for none.
  sounds:
    countdown: block.note_block.hat
    start: entity.ender_dragon.growl
    kill: entity.experience_orb.pickup
    out: entity.blaze.death
    win: ui.toast.challenge_complete
    podium: entity.player.levelup
    lose: entity.villager.no

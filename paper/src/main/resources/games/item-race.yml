# A long scramble in a very large arena. Everyone starts spread around its middle and loots the starter chests; the match
# picks random items for the whole game, and the first player (or team) to hand them in at a deposit wins.
# If time runs out first, nobody wins. Deaths are final and players fight, mine and build freely.
# The arena needs: spawns spread around the middle (/mga arena example spawn add), loot containers for the starter chests
# (/mga arena example loot add chest), one or more regions called deposit or deposit-<anything> (any block inside one takes the
# item; /mga arena example region deposit set), a region called border if border: is used below, and a saved map so the
# arena is put back after each match (/mga arena example map save). Build it as big as you like: the map is saved and reset
# like any other arena.
# This is a long event; give it a bigger prize with a schedule's rewards (see schedules/example.yml), not here.
gametype: item-race
name: "<green>Item Race"
min-players: 2
max-players: 24
# Players wait in the arena; set a lobby (/mga lobby set) and use "lobby" to keep them out of it until the start.
waiting: arena
arenas: [example]
# One hour. Time up without a deposit means no winner.
play-seconds: 3600
# Play in teams to race as teams; without this everyone races for themselves.
# teams: { count: 4 }
# The targets are picked at random from these, by weight (default 1), when play starts. Only the dimensions below are used.
# Portals don't work in matches, so keep this to the overworld unless the arena itself can reach the other dimensions.
# How many different items are asked for (1 to 5, default 1), and whether a player (or team) must hand in all of them
# (goal: all, default; the sidebar ticks them off) or whether any one of them is enough (goal: any).
# targets: 3
# goal: all
# How an item is handed in: drop it (Q) so that it ends up inside a deposit region, such as the bottom of a hole (hand-in: drop, default), or right click a deposit
# block with it (hand-in: click). A team must then wait this many seconds between hand-ins; dropped items just wait in the region. A team that
# found all its items still has to hand them in one by one (0 = no wait).
# hand-in: drop
# hand-in-delay-seconds: 30
items:
  overworld:
    - { item: diamond, weight: 3 }
    - { item: emerald, weight: 2 }
    - { item: gold_block, weight: 2 }
    - { item: cake, weight: 2 }
    - { item: golden_apple, weight: 2 }
    - { item: enchanting_table, weight: 1 }
    - { item: bookshelf, weight: 2 }
    - { item: bread, weight: 1 }
    - { item: bucket, weight: 1 }
    - { item: compass, weight: 1 }
  nether:
    - blaze_rod
    - quartz_block
  end:
    - ender_pearl
dimensions: [overworld]
# Items that may never be picked, whatever the dimensions.
exclude: []
# Closes the border region in from its widest side to 200 blocks over 55 minutes; half a heart a second outside it.
# Leave this out for no border (players are then free to wander the whole world).
border: { end-size: 200, shrink-seconds: 3300, damage: 1 }
features:
  playing:
    break-blocks: { blacklist: [bedrock, barrier], place: true }
    # Fills the arena's loot containers when first opened: the starter chests.
    loot: {}
stats: [combat]
quit: { then: die, rejoin-seconds: 120 }
hud:
  sidebar:
    # %item% is the one target; with several targets the lines %item1% to %item5% list them (lines of unused ones are left out).
    playing:
      - ""
      - "<gray>Time: <yellow>%time%"
      - "<gray>Find: <white>%item%"
      - "<gray>Find: %item1%"
      - "<gray>      %item2%"
      - "<gray>      %item3%"
      - "<gray>      %item4%"
      - "<gray>      %item5%"
      - "<gray>Players: <white>%alive%"

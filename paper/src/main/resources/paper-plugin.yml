name: MiniGami
version: '${version}'
main: io.github.tst_038.minigami.paper.MiniGamiPlugin
description: Multi-game minigame engine
api-version: '26.3'
dependencies:
  server:
    # Optional; FastAsyncWorldEdit also answers to this name. Used to reset arenas from schematics.
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    # Optional; offers stats as placeholders, e.g. for holograms.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  minigami.admin:
    description: Staff rank. Set up arenas, games, kits and the config, reload, and restore players; plus everything a mod can
    default: op
    children:
      minigami.mod: true
  minigami.mod:
    description: Staff rank. Start, stop, pause and change matches, and run game nights; plus everything a helper can
    default: op
    children:
      minigami.helper: true
      minigami.host: true
  minigami.helper:
    description: Staff rank. List and look at matches, and kick players from matches and game nights
    default: op
  minigami.host:
    description: Run game nights with /mg night
    default: op
  minigami.play.*:
    description: Join every game (each game has its own minigami.play.<game>)
    default: true
  minigami.night.join:
    description: Join game nights and hear when one opens
    default: true
  minigami.schedule.join:
    description: Hear when a schedule opens a game and join it with /mg schedule join, whatever games one may play otherwise
    default: true

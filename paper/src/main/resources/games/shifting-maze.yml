# Minotaurs hunt teams of runners through a maze built when the match starts. Find your team's keys, then reach the centre.
# The arena needs: a region called maze (floor layer at its bottom, at least wall-height + 1 high, empty when the map is saved),
# spawns, a saved map that covers the maze (/mg arena <id> map save) and WorldEdit (FastAsyncWorldEdit recommended).
gametype: shifting-maze
name: "<gold>Shifting Maze"
min-players: 2
max-players: 20
waiting: arena
name-tags: teammates
cell-width: 3
wall-thickness: 1
wall-height: 3
shift-seconds: 20
shifts: 8
warning: { seconds: 6, flicker: true, particles: true, sound: "block.grindstone.use" }
keys: 3
head-start-seconds: 20
run-seconds: 300
sight: { every-seconds: 30, seconds: 3 }
safe-zone: { radius: 0 }
blocks:
  # A block, or blocks with weights: each block of the floor/wall picks one at random. Add lava or water pools here if you like.
  floor: { cobblestone: 35, mossy_cobblestone: 20, stone: 25, gravel: 8, andesite: 8, water: 3, shroomlight: 2 }
  wall: { stone_bricks: 40, mossy_stone_bricks: 20, cracked_stone_bricks: 15, cobblestone: 15, mossy_cobblestone: 10 }
  warning: cracked_stone_bricks
  exit: gold_block
  key: tripwire_hook
  # ceiling: stone_bricks   # dark inside: turn off mob spawning or light the maze
roles:
  minotaur:
    name: Minotaur
    color: dark_red
    per: 5
    lives: 0
    name-tags: everyone
    features:
      head-start: { freeze: {}, effects: { blindness: 1 } }
      running: { effects: { speed: 1 } }
# Teams of 2 among the runners; size: 1 makes everyone run alone (at most 8 runners then).
teams: { size: 2 }
lives: 0
arenas: [example]
features:
  running:
    no-hunger: {}
    no-damage: { causes: [fall] }
quit: { then: out }
hud:
  sidebar:
    default: ["", "<gray>Time: <yellow>%time%", "<gray>Next shift: <white>%next-shift%", "<gray>Next glow: <white>%next-glow%", "<gray>Team: %team%", "<dark_red>Minotaurs: <white>%minotaur%"]
    building: ["", "<gray>Building the maze...", "<gray>Team: %team%", "<dark_red>Minotaurs: <white>%minotaur%"]
  boss-bar:
    text:
      head-start: "<green>Head start <white>%time% <gray>until the Minotaurs wake"
      running: "<gold>Shifting Maze <white>%time%"

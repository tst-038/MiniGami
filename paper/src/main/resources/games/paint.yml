# Walk over the canvas to paint the blocks under your feet in your colour. Every block you hold is a point and painting over
# someone else's takes it from them. Most blocks when time is up wins.
# The arena needs: a region group canvas (any number of regions, /mga arena example region canvas set) with white concrete
# (or whatever paintable lists) inside, spawns, and a saved map so the paint is cleaned up (/mga arena example map save).
# With a schematic saved for the region named canvas (/mga arena example region canvas schematic) it is pasted fresh before every match.
gametype: paint
name: "<light_purple>Paint"
min-players: 2
max-players: 16
waiting: arena
play-seconds: 180
# Blocks that can be painted over; painted blocks can always be painted over again.
paintable: [white_concrete]
# One block per team (or player) in turn, in the order of the team colours: red, blue, green, yellow, aqua, pink, orange, white,
# dark green, dark blue, dark aqua, dark purple, gray, dark gray, black, dark red (the dark gray player paints white).
# Names and name tags take the same colour.
colors: [red_concrete, blue_concrete, lime_concrete, yellow_concrete, light_blue_concrete, pink_concrete, orange_concrete, light_gray_concrete, green_concrete, magenta_concrete, cyan_concrete, purple_concrete, gray_concrete, white_concrete, black_concrete, brown_concrete]
# Everyone paints for themselves, in a colour each. Use teams: { count: 2 } to paint in teams.
teams: { size: 1 }
arenas: [example]
# Play in the region canvas: its schematic (if any) is pasted when the match opens, and spawns must stand inside it.
region: canvas
features:
  playing:
    no-hunger: {}
    no-damage: { causes: [entity-attack] }
quit: { then: stay, rejoin-seconds: 180 }
hud:
  sidebar:
    playing: ["", "<gray>Time: <yellow>%time%", "<gray>Your blocks: <white>%points%", "", "%scores%"]

  invite-expired: "%prefix%<gray>The invite from <white>%leader%</white> <gray>to <white>%player%</white> <gray>expired."
  joined: "%prefix%<green>You joined <white>%leader%</white><green>'s party."
  member-joined: "%prefix%<white>%player%</white> <green>joined the party."
  left: "%prefix%<yellow>You left the party."

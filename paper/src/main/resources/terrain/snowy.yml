# Snowfields with spruce trees and frozen-looking ponds.
shape:
  base: 42
  hills: {amplitude: 16, scale: 48, octaves: 4}
  detail: {amplitude: 2, scale: 12, octaves: 2}
  sea-level: 30
  deep-below: 12
  pad-radius: 5
  rock: stone
  deep-rock: deepslate
  floor: bedrock
surface:
  top: snow_block
  under: dirt
  depth: 3-4
  shore: gravel
  shore-under: stone
  lakebed: {gravel: 3, clay: 1}
caves: {width: 0.08, scale: 24, min-depth: 5, lava-level: 8}
ores:
  - ores/vanilla
# Quotas can count these together: `quota: {ores: 60-}`.
groups:
  ores: [coal_ore, iron_ore, copper_ore, gold_ore, redstone_ore, lapis_ore, diamond_ore,
         deepslate_coal_ore, deepslate_iron_ore, deepslate_copper_ore, deepslate_gold_ore,
         deepslate_redstone_ore, deepslate_lapis_ore, deepslate_diamond_ore]
pools: [{name: water-pools, fluid: water, count: 1-2, radius: 3-5, depth: 3}]
trees: [{name: trees, log: spruce_log, leaves: spruce_leaves, height: 5-8, count: 15-30, grows-on: [snow_block]}]

name: MiniGami
version: '${version}'
main: io.github.tst_038.minigami.paper.MiniGamiPlugin
description: Multi-game minigame engine
api-version: '26.3'
dependencies:
  server:
    # Optional; FastAsyncWorldEdit also answers to this name. Used to reset arenas from schematics.
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    # Optional; offers stats as placeholders, e.g. for holograms.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  minigami.admin:
    description: Set up arenas, games and the config, and manage matches and players
    default: op

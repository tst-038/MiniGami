# Player-facing text, in MiniMessage: https://docs.papermc.io/adventure/minimessage/format
# <prefix> works in every message. Other placeholders are listed per message.
prefix: "<dark_gray>[<gold>Games</gold>]</dark_gray> "

join:
  already-in-match: "<prefix><red>You are already in a match. Use <white>/mg leave</white> first."
  # <mode>: the mode as typed
  unknown-mode: "<prefix><red>There is no mode called <white><mode></white>."
  # <mode>: the mode's name
  no-free-arena: "<prefix><red>All arenas of <mode><red> are busy or full. Try again later."
  failed: "<prefix><red>You can't join right now. Your items from an earlier match still need to be restored; please rejoin the server or ask staff."

leave:
  not-in-match: "<prefix><red>You are not in a match."

start:
  nothing-to-start: "<prefix><red>There is no match waiting for players."
  started: "<prefix><green>Match started."

# <player>: the player, <players>: how many joined, <needed>: how many are needed to start
match:
  joined: "<prefix><yellow><player></yellow> joined <gray>(<players>/<needed>)"
  # A player ran out of lives.
  eliminated: "<prefix><red><player></red> is out!"
  # <seconds>: delay before the start
  starting: "<prefix><green>Enough players! Starting in <seconds> seconds."
  start-cancelled: "<prefix><red>Not enough players anymore, start cancelled."
  # <player>: the player who left
  left: "<prefix><yellow><player></yellow> left the match."
  you-left: "<prefix><gray>You left the match."
  # <player>: the winner
  winner: "<prefix><gold><player></gold> wins the match!"
  no-winner: "<prefix><gray>The match ended without a winner."

# <player>: the player who fell
lobby:
  set: "<prefix><green>Set the lobby to where you stand."
  save-failed: "<prefix><red>Could not save the lobby; see the server log."

# Arena setup. <arena>: the arena id, <world>: its world, <number>: a spawn's number as listed by info
arena:
  unknown: "<prefix><red>There is no arena called <white><arena></white>."
  exists: "<prefix><red>An arena called <white><arena></white> already exists."
  invalid-id: "<prefix><red><white><arena></white> can't be an arena id: use lower case letters, digits and dashes."
  in-use: "<prefix><red>A match is running in <white><arena></white>; change it once the match has ended."
  other-world: "<prefix><red><white><arena></white> is in world <white><world></white>; go there to set its points."
  no-spawn: "<prefix><red><white><arena></white> has no spawn <white><number></white>."
  save-failed: "<prefix><red>Could not save <white><arena></white>; see the server log."
  created: "<prefix><green>Created arena <white><arena></white> in <white><world></white>. Add spawns with <white>/mg arena <arena> addspawn</white>."
  spawn-added: "<prefix><green>Added spawn <white><number></white> to <white><arena></white>."
  spawn-removed: "<prefix><green>Removed spawn <white><number></white> from <white><arena></white>."
  waiting-spot-set: "<prefix><green>Set the waiting spot of <white><arena></white>."
  # <spawns>: how many spawns
  info: "<prefix><gold><arena></gold> <gray>in <white><world></white>, <white><spawns></white> spawns. Click a point to go there."
  # <x>, <y>, <z>; wrap text in <teleport>…</teleport> to make it teleport on click
  info-spawn: "<gray> - <teleport><hover:show_text:'Teleport'><white>spawn <number></white>: <x>, <y>, <z></hover></teleport>"
  info-waiting-spot: "<gray> - <teleport><hover:show_text:'Teleport'><white>waiting spot</white>: <x>, <y>, <z></hover></teleport>"
  info-no-waiting-spot: "<gray> - no waiting spot; players wait at spawn 1"

# <matches>, <listeners>, <snapshots>; per match: <game>, <mode>, <arena>, <phase>, <members>, <alive>, <tick>
reload:
  done: "<prefix><green>Config loaded: <white><arenas></white> arenas, <white><modes></white> modes."
  failed: "<prefix><red>Config not loaded, the old one stays in use. <white><problems></white> problem(s):"
  problem: "<red> - <problem>"

edit:
  invalid-id: "<prefix><red><white><id></white> can't be an id: use lower case letters, digits and dashes."
  unknown: "<prefix><red>There is no <white><file></white>."
  exists: "<prefix><red><white><file></white> already exists."
  here-needs-player: "<prefix><red>Only a player can use <white>here</white> as a value."
  bad-value: "<prefix><red><white><value></white> isn't a value; put text in quotes, e.g. <white>\"<value>\"</white>."
  invalid: "<prefix><red>Not saved: <white><file></white> would have these problems:"
  problem: "<red> - <problem>"
  save-failed: "<prefix><red>Could not save <white><file></white>; see the server log."
  set: "<prefix><green>Set <white><key></white> in <white><file></white>."
  unset: "<prefix><green>Removed <white><key></white> from <white><file></white>."
  created: "<prefix><green>Created <white><file></white>. Change it with <white>set</white> and <white>unset</white>."
  deleted: "<prefix><green>Deleted <white><file></white>. A copy is kept as <white><file>.deleted</white> until the next delete of it."

snapshot:
  none: "<prefix><gray><player> has no saved state."
  in-match: "<prefix><red><player> is in a match; their state comes back when they leave it."
  unreadable: "<prefix><red>The saved state of <player> can't be read; the server log names the file to fix."
  saved: "<prefix><gold><player></gold><gray>: state saved for a match, not given back yet."
  last: "<prefix><gold><player></gold><gray>: state given back last."
  details: "<gray> <game-mode> at <x>, <y>, <z> in <world>, health <health>, food <food>, level <level>"
  items: "<gray> Items: <white><items>"
  effects: "<gray> Effects: <white><effects>"
  restore-hint: "<gray> Give it back with <white>/mg snapshot <player> restore</white>."
  restore-last-hint: "<gray> Put it back with <white>/mg snapshot <player> restore</white>; their current state is kept, so doing it again undoes it."
  restored: "<prefix><green>Gave <player> their saved state back."
  restored-last: "<prefix><green>Put the last state of <player> back. Run it again to undo."
  restore-failed: "<prefix><red>Could not give <player> their state back; see the server log."

debug:
  summary: "<prefix><gray>Matches: <white><matches></white>, listeners: <white><listeners></white>, players with saved state: <white><snapshots></white>"
  match: "<prefix><gray><mode> on <arena>: phase <white><phase></white>, <white><members></white> in match, <white><alive></white> alive, tick <white><tick></white>"

# A game: what players join, with /mg join spleef, and see their stats of. The game type is the code it runs.
# These example games all play in the example arena; spawns are optional (spawns: { mode: arena } asks for them): without them players start on random places of the highest floor of its map (/mga arena example map save), or of its region.
# What a game type or feature can be set to: /mga gametype <id> info and /mga options.
# Change a game by command with /mga game <id> set <key> <value>, or edit the file and /mga reload.
#
# Spleef: dig the snow from under the others; whoever falls through is out, the last one standing wins.
# The arena needs a snow_block floor to stand on, and a saved map (/mga arena example map save) to put it back after each match.
gametype: last-standing
name: "<aqua>Spleef"
min-players: 2
max-players: 8
# in-place: players stay where they are until the start; lobby: they wait in the lobby (/mga lobby set);
# arena: they wait in the arena. In the lobby and the arena their own state is saved and cleared at once.
waiting: arena
# How many deaths put a player out; 0 means they always respawn. Without it, the game decides (last-standing: 1).
# lives: 3
# Free arenas are picked in this order; each needs a saved map or spawns.
arenas: [example]
# Features per phase of the game (last-standing has waiting, playing and ending).
features:
  playing:
    # Nothing drops on death; without this items and XP drop as in vanilla.
    death-items: { items: vanish, xp: vanish }
    # Items for every player, each with an optional amount ([iron_sword, arrow 16]), or an inventory saved with /mga kit save: { saved: <name> }
    # 'unbreakable' makes an item never wear out.
    kit: { items: [diamond_shovel unbreakable] }
    # Only the shovel breaks snow (instantly); with a bare hand nothing breaks. Leave tools out to allow any hand.
    break-blocks: { whitelist: [snow_block], instant: true, tools: [diamond_shovel] }
    # Players can't throw their items away.
    no-drop-items: {}
    give-drops: { snow_block: [snowball] }
    projectile-breaks: { blocks: [snow_block] }
    # Standing on one block too long breaks it.
    anti-camping: { seconds: 3, blocks: [snow_block] }
    no-damage: { causes: [fall, entity-attack, entity-sweep-attack] }
    # Just below the lowest spawn when y is left out; for a floor of several layers, set it below the bottom one: { y: 40 }
    void-kills: {}
# Variants are laid over the settings above and count as spleef in the stats; each needs a name.
# Players join one with /mg join spleef <variant>.
variants:
  duos:
    # In pairs: the last team with anyone still standing wins.
    name: "<aqua>Spleef Duos"
    min-players: 4
    teams: { size: 2 }
    spawns: { teams: spread }   # players spread over all spawns instead of a team sharing one
  lives:
    # A fall sends you back to a spawn until your last life is gone.
    name: "<aqua>Spleef <gray>(3 lives)"
    lives: 3
  decay:
    # The snow also crumbles shortly after you step on it: keep moving.
    name: "<aqua>Decay Spleef"
    features:
      playing:
        # 20 ticks is a second.
        decay-floor: { delay-ticks: 8, blocks: [snow_block] }
        # Pointless with a floor that crumbles anyway.
        anti-camping: false
